[workspace]
resolver = "3"
members = [".", "server"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# `deny`, not `forbid`: the tree-sitter grammar FFI in server/src/syntax needs one local allow.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[package]
name = "janet-zed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
