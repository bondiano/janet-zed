# Janet data: parsed with the Janet grammar, but no language server, so data files get no
# diagnostics meant for code.
name = "JDN"
grammar = "janet_simple"
path_suffixes = ["jdn"]
line_comments = ["# "]
autoclose_before = ";:.,=}])> \n\t\""
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["-", "!", "$", "%", "&", "*", "+", ".", "/", ":", "<", "=", ">", "?", "@", "^", "_"]
tab_size = 2
