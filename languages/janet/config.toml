name = "Janet"
grammar = "janet_simple"
path_suffixes = ["janet", "jdn"]
first_line_pattern = '^#!.*\bjanet\b'
line_comments = ["# "]
autoclose_before = ";:.,=}])> \n\t\""
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["-", "!", "$", "%", "&", "*", "+", ".", "/", ":", "<", "=", ">", "?", "@", "^", "_"]
tab_size = 2
