[package]
name = "janet-zed-server"
version = "0.2.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5"
dunce = "1.0.5"
ignore = "0.4.33"
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", default-features = false, features = ["ring", "tokio-runtime"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "process", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tree-sitter = "0.27.0"
tree-sitter-language = "0.1.8"
url = "2.5.8"

[lints]
workspace = true

[build-dependencies]
cc = "1.4.6"

[dev-dependencies]
insta = "1.48.0"
