name: Release

# Pushing a `v*` tag publishes janet-lsp-plus binaries; the extension downloads the one for
# the user's platform (see server_asset in src/lib.rs for the asset names).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches the versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The extension downloads the release tagged with its own version.
      - run: |
          for manifest in extension.toml Cargo.toml janet-check/Cargo.toml janet-lsp-plus/Cargo.toml; do
            version=$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$manifest::version $version, tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

  build:
    needs: [check, version]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          # The Intel macOS images are retired: cross-compiled on Apple silicon.
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Native, so `ring` and the grammar's C build without a cross toolchain.
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build -p janet-lsp-plus --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf janet-lsp-plus-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release janet-lsp-plus
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/janet-lsp-plus.exe -DestinationPath janet-lsp-plus-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: janet-lsp-plus-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: janet-lsp-plus-*
