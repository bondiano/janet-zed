name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs it before building anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests run the real `janet` and spork's netrepl, installed the way spork's own CI does.
  # The same Janet everywhere: core signatures in the snapshots come from its docstrings.
  JANET_VERSION: "1.42.1"
  # `netrepl/run-server` is newer than spork's last tag, v1.2.0.
  SPORK_REVISION: 0667f96b74de52747ffe5e19e185563ebf53816b

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Outside the checkout: the tests check every Janet file of the repository.
      - name: Install Janet (macOS, Linux)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "v$JANET_VERSION" https://github.com/janet-lang/janet
          make -C janet -j && sudo make -C janet install

      - name: Install Janet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          curl.exe -fSLo janet.msi "https://github.com/janet-lang/janet/releases/download/v$env:JANET_VERSION/janet-$env:JANET_VERSION-windows-x64-installer.msi"
          Start-Process msiexec.exe -Wait -ArgumentList '/quiet', '/i', 'janet.msi', 'ALLUSERS=1'
          # The installer sets the variables system-wide; later steps only see what is exported here.
          foreach ($scope in 'Machine', 'User') {
            foreach ($name in 'JANET_PATH', 'JANET_HEADERPATH', 'JANET_LIBPATH', 'JANET_BINPATH', 'JANET_MANPATH') {
              $value = [Environment]::GetEnvironmentVariable($name, $scope)
              if ($value) { "$name=$value" >> $env:GITHUB_ENV }
            }
            [Environment]::GetEnvironmentVariable('Path', $scope) -split ';' |
              Where-Object { $_ -like '*Janet*' } |
              ForEach-Object { $_ >> $env:GITHUB_PATH }
          }

      # spork builds its native modules with MSVC.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Check out spork
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/janet-lang/spork
          git -C spork checkout "$SPORK_REVISION"
      - name: Install spork
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: sudo janet -e '(bundle/install "spork")'
      # Not bash: its coreutils `link` shadows MSVC's linker.
      - name: Install spork (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: janet -e '(bundle/install `spork`)'

      # rust-toolchain.toml pins the toolchain; this installs it with its components and targets.
      - run: rustup show
      - run: just check
