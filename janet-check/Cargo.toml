[package]
name = "janet-check"
description = "Type inference and analysis for Janet: parsing, scopes, modules and the core environment"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["janet", "lint", "types", "static-analysis", "lsp"]
categories = ["development-tools", "command-line-utilities"]
# The CLI tests run against ../fixtures, which is outside the package.
exclude = ["tests"]

[features]
default = ["cli"]
# The `janet-check` binary. Off for crates that only want the library.
cli = ["dep:clap"]
# Snapshot rendering, for the tests of crates built on this one.
test-support = []

[[bin]]
name = "janet-check"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"], optional = true }
crossbeam-channel = "0.5"
dunce = "1.0.5"
ignore = "0.4.33"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol_str = "0.3.6"
tree-sitter = "0.27.0"
tree-sitter-language = "0.1.8"
url = "2.5.8"

[lints]
workspace = true

[build-dependencies]
cc = "1.4.6"

[dev-dependencies]
insta = "1.48.0"
# The CLI tests share the library's test helpers.
janet-check = { path = ".", features = ["test-support"] }
